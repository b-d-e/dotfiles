# Prefix key: ` on the local machine, § on any remote (SSH'd-into) box.
# This lets nested tmux work: the outer/local server keeps `, the inner/
# remote server uses §, so a keypress is caught by exactly one server.
# $SSH_CONNECTION is set by sshd on the remote side and empty locally.
unbind C-b   # Unbind the default Ctrl+b
if-shell '[ -n "$SSH_CONNECTION" ]' \
    'set -g prefix §  ; bind § send-prefix' \
    'set -g prefix `  ; bind ` send-prefix'

# Split window vertically with '-'
bind - split-window -v  # Bind `-` to vertical split

# Split window horizontally with '|'
bind | split-window -h  # Bind `|` to horizontal split

# Optional: Add '\' for horizontal split
# bind \ split-window -h  # Bind '\' to horizontal split

###### PANES #######
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes using PREFIX H, J, K, L
bind Left resize-pane -L 5
bind Down resize-pane -D 5
bind Up resize-pane -U 5
bind Right resize-pane -R 5

bind 7 resize-pane -t 1 -x 90
bind 8 resize-pane -t 1 -x 60
bind 9 resize-pane -t 1 -x 30
bind 0 resize-pane -t 0 -x 30


# Initialize TPM (Tmux Plugin Manager)
run -b '~/.tmux/plugins/tpm/tpm'

####### PLUGINS #######

# TPM (Tmux Plugin Manager) initialization
set -g @plugin 'tmux-plugins/tpm'

# Install tmux-battery (displays battery status)
set -g @plugin 'tmux-plugins/tmux-battery'

# Add tmux-spotify plugin
set -g @plugin 'robhurring/tmux-spotify'

# Nerdstatus icons
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

# Treemux
set -g @treemux-tree-nvim-init-file '~/.tmux/plugins/treemux/configs/treemux_init.lua'
set -g @plugin 'kiyoon/treemux'

####### STATUS BAR CONFIGURATION #######

# Configure Right-hand side of the status bar with Spotify information
# Will only show Spotify info when playing, otherwise show regular status
set -g status-right '#{music_status} #{artist}: #{track} | #{battery_status_bg} Batt: #{battery_icon} #{battery_percentage} #{battery_remain} | %a %h-%d %H:%M'

# Optional: Format for the Spotify status
set -g @spotify_playing_icon "♫"
set -g @spotify_paused_icon "■"

# Optional: Add padding or other items to the right side if needed
set -g status-right-length 100  # Increased length to accommodate Spotify info

####### REMOTE (SSH) STATUS BAR #######
# On a remote box: colour the status bar with a stable, hostname-derived
# colour (same host -> same colour across reconnects, different hosts ->
# different colours) and show the hostname prominently on the left so it's
# obvious which server a pane/window belongs to.
if-shell '[ -n "$SSH_CONNECTION" ]' {
    # Curated palette of nice, saturated backgrounds that keep white text
    # readable -- deliberately NO greens, so a remote bar never looks like
    # the local/master host's default green. A deterministic hash of the
    # hostname (cksum) picks a stable index (POSIX sh, no arrays), so the
    # same host always gets the same colour and different hosts differ.
    run-shell 'set -- \
        "#1f6feb" "#8957e5" "#bc4c00" "#0969da" "#cf222e" "#a371f7" \
        "#bf3989" "#1b7c83" "#9a6700" "#6e40c9" "#e16f24" "#3192aa"; \
        i=$(hostname | cksum | cut -d" " -f1); n=$#; \
        idx=$(( i % n + 1 )); eval "c=\${$idx}"; \
        tmux set -g status-style "bg=$c,fg=#ffffff"'
    # Hostname on the left, reverse-video so it pops against the coloured bar.
    set -g status-left '#[reverse,bold]  #H  #[noreverse] '
    set -g status-left-length 40
}

# Initialize TPM (required for plugins to work)
# run -b '~/.tmux/plugins/tpm/tpm'


set-option -g update-environment "TERM_PROGRAM"
